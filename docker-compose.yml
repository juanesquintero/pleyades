name: pleyades

services:
  web:
    container_name: pleyades-web_dev
    build:
      context: ./web
      dockerfile: ./Dockerfile
      target: development
    image: pleyades-web:1.0.0
    volumes:
      - ./ies.json:/app/ies.json
      - ./web:/app
    env_file:
      - ./web/.env
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=run.py
      - TEMPLATES_AUTO_RELOAD=1
      - CLI_IES_NAME=${IES_CLIENT}
    ports:
      - 5001:80
      - 5678:5678
    links:
      - api:api
    networks:
      - dev-net
    depends_on:
      - api
    working_dir: /app
    command: python -m debugpy --listen 0.0.0.0:5678 --wait-for-client run.py

  api:
    container_name: pleyades-api_dev
    build:
      context: ./api
      dockerfile: ./Dockerfile
      target: development
    image: pleyades-api:1.0.0
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=run.py
      - CLI_IES_NAME=${IES_CLIENT}
    ports:
      - 8001:80
      - 5679:5679
    links:
      - redis
      - db
      - db-ies
    networks:
      - dev-net
    depends_on:
      - db
    command: python -m debugpy --listen 0.0.0.0:5679 --wait-for-client run.py --celery
    # command: python -m debugpy --listen 0.0.0.0:5679 --wait-for-client run.py

  redis:
    image: redis:latest
    container_name: pleyades-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - ./redis_data:/data
    networks:
      - dev-net
      - deploy-net

  db:
    container_name: pleyades-db
    image: mysql:8.0.3
    cap_add:
      - SYS_NICE
    env_file:
      - ./api/.env
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PWD}
    volumes:
      - ./api/db/pleyades/dev:/var/lib/mysql
      - ./api/db/pleyades/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dev-net
      - deploy-net

  db-ies:
    build:
      context: ./api/db/ies
      dockerfile: ./Dockerfile
    image: pleyades-db-ies:1.0.0
    container_name: pleyades-db-ies
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 1433:1433
    env_file:
      - ./api/db/ies/.env
    volumes:
      - ./api/db/ies/sqlserver-data:/var/opt/mssql
    networks:
      - dev-net
      - deploy-net


  adminer:
    container_name: pleyades-adminer
    image: adminer:4.8.1
    ports:
      - 8080:8080
    links:
      - db
      - db-ies
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge

  deploy-net:
    driver: bridge
