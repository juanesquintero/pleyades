# Gitlab CI/CD Variables needed for this pipeline

stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - venv-web/
    - venv-api/

before_script:
  - echo "Starting pipeline..."

.default-python-job:
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip/
  script:
    - echo "Running Python job..."
    - pip install --upgrade pip

.web-base-job:
  extends: .default-python-job
  before_script:
    - python -m venv venv-web
    - source venv-web/bin/activate
    - pip install -r web/requirements.txt
  cache:
    key: "$CI_COMMIT_REF_SLUG-web"
    paths:
      - venv-web/

.api-base-job:
  extends: .default-python-job
  before_script:
    - python -m venv venv-api
    - source venv-api/bin/activate
    - pip install -r api/requirements.txt
  cache:
    key: "$CI_COMMIT_REF_SLUG-api"
    paths:
      - venv-api/

web-test:
  extends: .web-base-job
  stage: test
  before_script:
    - pip install -r web/requirements-dev.txt
  script:
    - echo "Testing web app..."
    - pytest web/tests

api-test:
  extends: .api-base-job
  stage: test
  before_script:
    - pip install -r api/requirements-dev.txt
  script:
    - echo "Testing API app..."
    - pytest api/tests

web-build:
  extends: .web-base-job
  stage: build
  script:
    - echo "Building web app..."

api-build:
  extends: .api-base-job
  stage: build
  script:
    - echo "Building api app..."

server-deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.19
    entrypoint: ["/bin/bash", "-c"]
  script:
    - echo "Deploying to AWS EC2..."
  when: manual

serverless-deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.19
    entrypoint: ["/bin/bash", "-c"]
  script:
    - echo "Deploying to AWS Lambda..."
  when: manual

.global_rules:
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
