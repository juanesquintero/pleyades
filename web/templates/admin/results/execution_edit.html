{% include 'components/header.html' %}

{% include 'components/sidebar.html' %}

<h5>Editar una Ejecucion</h5>
<br>
{% if e.name %}
<form action="{{url_for('ResultAdmin.update_execution')}}" method="POST" data-toggle="validator" class="jumbotron py-4 pr-4 bg-light"
    style="max-width:75%;">
    <div class="container">
        <div class="form-group row">
            <div class="col-sm-6">
                <label>Nombre</label>
                <input type="text" name="name" maxlength="250" require value="{{e.name}}" hidden>
                <input type="text" class="form-control input-sm" maxlength="250" require value="{{e.name}}" disabled>
            </div>
            <div class="col-sm-6">
                <label>Conjunto de Datos</label>
                <input type="text" class="form-control" maxlength="200" value="{{e.conjunto}}" disabled >
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-10">
                <label>Ejecutor</label>
                <input type="email" class="form-control input-sm" maxlength="200" required value="{{e.executor}}" disabled>
            </div>
            <div class="col-sm-2">
                <label>Numero</label>
                <input type="number" class="form-control input-sm" maxlength="30" required value="{{e.numero}}" disabled>
            </div>
        </div>

        <div class="form-group row">
            <div class="col-sm-5">
                <label >Fecha Inicial</label>
                <input type="datetime" class="form-control input-sm" maxlength="30" required value="{{e.fechaInicial}}" disabled>
            </div>
            <div class="col-sm-5">
                <label >Fecha Final</label>
                <input type="datetime" class="form-control input-sm" maxlength="30" required value="{{e.fechaFinal}}" disabled>
            </div>
            <div class="col-sm-2">
                <label >Duracion</label>
                <input type="number" class="form-control input-sm" maxlength="30" required value="{{e.duracion}}" disabled>
            </div>

        </div>
        <div class="form-group row">
            <div class="col-sm-3">
                <label >Estado</label>
                <select name="status" id="rol" class="form-control input-sm" maxlength="30" required>
                    <option value="Successful" key="1" {% if e.status=='Successful' %} selected {% endif %}> Successful </option>
                    <option value="Failed" key="2" {% if e.status=='Failed' %} selected {% endif %}> Failed </option>
                </select>
            </div>
            <div class="col-sm-9">
                <label >Resultados</label>
                &nbsp;(<small>JSON input</small>)
                <textarea type="text" name="results" class="form-control input-sm" maxlength="800"  rows="6" cols="50">{% if e.results %} {{e.results}} {% endif %}</textarea>
            </div>
        </div>

        <!--Boton para validar campos-->
        <br>
        <div class="text-center">
            <input type="submit" value="Actualizar" class="btn btn-dark text-white my-primary" />
            &nbsp;
            <button type="button" onclick="goBack()" class="btn btn-outline-dark">Atras</a>
        </div>
    </div>
</form>
{% else %}

<div class="alert alert-danger" role="alert">
    <h5 class="alert-heading">Aviso!!</h5>
    <e>No se pudo encontrar los results a editar</e>
    <hr>
</div>

{% endif %}


{% include 'components/footer.html' %}
