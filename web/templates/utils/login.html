{% include 'components/header.html' %}

<div class="d-flex align-self-stretch bg-light h-100 pb-5">
  <form
    action="{{url_for('auth.login')}}"
    method="POST"
    data-toggle="validator"
    class="jumbotron container my-5 py-4 px-4 bg-white border rounded col-10 col-md-5 col-xl-4"
  >
    <center>
      <h4>Iniciar Sesión</h4>
    </center>
    <br />
    <div class="form-group">
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        aria-describedby="emailHelp"
        placeholder="Dirección de correo"
        required
      />
    </div>
    <div class="form-group d-flex align-content-center align-items-center">
      <input
        type="password"
        class="form-control mb-1"
        id="password"
        name="password"
        placeholder="Contraseña"
        required
      />
      &nbsp;
      <div
        id="toggle-password"
        class="align-self-center ml-1 btn btn-light fa fa-eye"
        onclick="tooglePassword()"
        style="cursor: pointer"
      ></div>
    </div>

    <script>
      function tooglePassword() {
        const psswdInputEl = document.getElementById("password");
        const togglePasswordEl = document.getElementById("toggle-password");
        if (psswdInputEl.type === "password") {
          psswdInputEl.type = "text";
          togglePasswordEl.classList.add("fa-eye-slash");
          togglePasswordEl.classList.remove("fa-eye");
        } else {
          psswdInputEl.type = "password";
          togglePasswordEl.classList.add("fa-eye");
          togglePasswordEl.classList.remove("fa-eye-slash");
        }
      }
    </script>

    {% if mensaje %}
    <div class="alert alert-danger py-0" role="alert">
      <p class="pt-1">{{mensaje}}</p>
    </div>
    {% endif %}

    <div class="d-flex justify-content-end">
      <a href="#"><small>¿Olvido su contraseña?</small></a>
    </div>
    <br />

    <div class="text-center">
      <input
        type="submit"
        value="Entrar"
        class="btn btn-dark text-white my-primary"
      />
    </div>
  </form>
</div>

{% include 'components/footer.html' %}
